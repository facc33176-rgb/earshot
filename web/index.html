<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B3654">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<title>Earshot</title>
</head>
<body data-phase="idle">
  <main id="home">
    <h1 class="name">Earshot</h1>
    <svg class="mark" viewBox="0 0 300 40" aria-hidden="true"><path d="M0 20 H110 q5 0 8 -6 t6 6 t6 -9 t6 9 t6 -4 t6 4 H285"/><circle cx="288" cy="20" r="4"/></svg>
    <p class="tag">a phone call that listens</p>
    <button id="call" class="call-btn" aria-label="Call">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1z"/></svg>
    </button>
    <button id="open-settings" class="link">Settings</button>
  </main>

  <section id="incall" aria-live="polite">
    <header><b class="name">Earshot</b><span id="clock">0:00</span></header>
    <canvas id="wave" title="Tap to interrupt"></canvas>
    <p id="status"></p>
    <p id="heard"></p>
    <div id="lines"></div>
    <p id="hint"></p>
    <p id="error" role="alert"></p>
    <button id="grace" hidden>Still here? Tap to keep talking</button>
    <footer>
      <button id="mute" class="round" aria-label="Mute" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg></button>
      <button id="hangup" class="round end" aria-label="Hang up"><svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1a1 1 0 0 1-.56.9 11 11 0 0 0-2.66 1.85 1 1 0 0 1-1.4 0L.29 13.08a1 1 0 0 1 0-1.41A16.9 16.9 0 0 1 12 7a16.9 16.9 0 0 1 11.71 4.67 1 1 0 0 1 0 1.41l-2.48 2.48a1 1 0 0 1-1.4 0 11 11 0 0 0-2.67-1.85 1 1 0 0 1-.56-.9v-3.1A15 15 0 0 0 12 9z"/></svg></button>
      <span id="timing"></span>
    </footer>
  </section>

  <dialog id="settings">
    <form method="dialog">
      <h2>Settings</h2>
      <label>Access token <input id="token" type="password" autocomplete="off" placeholder="only if the server has ACCESS_TOKEN"></label>
      <label class="row"><input id="dictation" type="checkbox"> Use the browser's own dictation (Chrome / Edge / Android, free; not available in mainland China)</label>
      <label class="row"><input id="barge" type="checkbox"> Interrupt by talking over the voice (best with headphones; tapping the wave always works)</label>
      <menu><button value="ok">Save</button></menu>
    </form>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
